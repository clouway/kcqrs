plugins {
  id 'java'
  id 'net.researchgate.release' version '3.0.2'
  id 'com.vanniktech.maven.publish' version '0.30.0'
  id 'org.jetbrains.kotlin.jvm' version '1.9.20' apply false
}

group = 'com.clouway.kcqrs'

ext {
  kotlin_version = '1.9.20'
}

allprojects {
  repositories {
    mavenCentral()
  }
}

subprojects {
  apply plugin: 'java'
  apply plugin: 'org.jetbrains.kotlin.jvm'
  apply plugin: 'com.vanniktech.maven.publish'

  sourceCompatibility = 1.8
  targetCompatibility = 1.8

  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
      jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_1_8
    }
  }

  mavenPublishing {
    publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL)
    signAllPublications()

    pom {
      name = project.name
      description = "${project.name} module of CQRS In Kotlin"
      inceptionYear = "2017"
      url = "https://github.com/clouway/kcqrs"
      licenses {
        license {
          name = "The Apache Software License, Version 2.0"
          url = "https://www.apache.org/licenses/LICENSE-2.0.txt"
          distribution = "repo"
        }
      }
      developers {
        developer {
          id = "telcong"
          name = "Telcong Bot"
          email = "telcong@clouway.com"
        }
      }
      scm {
        url = "https://github.com/clouway/kcqrs"
        connection = "scm:git:https://github.com/clouway/kcqrs.git"
        developerConnection = "scm:git:ssh://github.com:clouway/kcqrs.git"
      }
    }
  }
}
